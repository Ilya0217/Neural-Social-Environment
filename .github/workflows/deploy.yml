name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref для деплоя (по умолчанию — текущая ветка)"
        required: false
        default: ""

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agent-dialogue-sim

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_repo: ${{ steps.meta.outputs.image_repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          sha="${GITHUB_SHA::12}"
          repo_lc="$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_tag=$sha"                          >> "$GITHUB_OUTPUT"
          echo "image_repo=${{ env.REGISTRY }}/$repo_lc" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.meta.outputs.image_repo }}:latest
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Ansible deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: prod
      url: https://agent-dialogue.ru
    steps:
      - name: Checkout (для ansible/)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible + collections
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.16,<2.18"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Render inventory
        run: |
          cat > ansible/inventory.ini <<EOF
          [prod]
          target ansible_host=${{ secrets.SSH_HOST }} ansible_user=${{ secrets.SSH_USER }}

          [prod:vars]
          ansible_python_interpreter = /usr/bin/python3
          ansible_ssh_private_key_file = $HOME/.ssh/id_ed25519
          EOF

      - name: ansible-playbook deploy.yml
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
          ANSIBLE_FORCE_COLOR: "True"
        run: |
          ansible-playbook \
            -i inventory.ini \
            --extra-vars "image_tag=${{ needs.build.outputs.image_tag }}" \
            --extra-vars "image_repo=${{ needs.build.outputs.image_repo }}" \
            playbooks/deploy.yml

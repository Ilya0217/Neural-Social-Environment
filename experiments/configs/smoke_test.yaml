id: smoke_test_h6_cot
hypothesis: H6
description: >
  Integration smoke test: 2 dialogues × 4 turns × 2 arms = 16 LLM calls total.
  Цель — убедиться, что real_dispatcher работает с DialogueManager,
  enable_cot прокидывается, метрики собираются. НЕ для проверки гипотезы.

seed_base: 99000
parallelism: 4

dialogue:
  n_turns: 4
  env_context_index: 0

arms:
  - name: cot_on
    n_dialogues: 2
    seed_offset: 0
    dialogue_overrides:
      enable_cot: true

  - name: baseline
    n_dialogues: 2
    seed_offset: 100
    dialogue_overrides:
      enable_cot: false

analysis:
  test: welch_t_test
  metric: actionability_rate
  params:
    alpha: 0.05
    alternative: greater
    d_threshold: 0.5

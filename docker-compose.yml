# Production-стек для agent-dialogue.ru (VPS 176.108.249.8, Ubuntu 24.04 LTS)
#
# Поднимает три сервиса:
#   - app     : Flask + Gunicorn (4 воркера), внутренний порт 5000
#   - nginx   : reverse-proxy + TLS-терминация, порты 80/443
#   - certbot : выпуск/обновление Let's Encrypt сертификатов
#
# Перед первым запуском:
#   1) Создать .env рядом с этим файлом (OPENAI_API_KEY=..., и т.п.).
#   2) Выпустить сертификат (одноразово):
#        docker compose run --rm certbot certonly \
#          --webroot -w /var/www/certbot \
#          -d agent-dialogue.ru -d www.agent-dialogue.ru \
#          --email admin@agent-dialogue.ru --agree-tos --no-eff-email
#      На время выпуска nginx должен слушать 80-й порт (см. server-блок для ACME).
#   3) docker compose up -d

services:
  app:
    # На сервере APP_IMAGE подставляется деплой-скриптом и указывает
    # на конкретный тег в GHCR (ghcr.io/ilya0217/agent-dialogue-sim:<sha>).
    # Локально, если переменная не задана, compose соберёт образ из исходников
    # с тегом agent-dialogue-sim:latest.
    image: ${APP_IMAGE:-agent-dialogue-sim:latest}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: ${APP_PULL_POLICY:-missing}
    container_name: agent-dialogue-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Переопределяем рантайм-каталоги, чтобы артефакты ложились в volume
      AGENT_RUNTIME_DIR: /data
      AGENT_LOG_DIR: /data/logs
      AGENT_OUTPUT_DIR: /data/outputs
      PYTHONUNBUFFERED: "1"
    volumes:
      - app_data:/data
    expose:
      - "5000"
    networks:
      - web
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: agent-dialogue-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    container_name: agent-dialogue-certbot
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Раз в 12 часов пытаемся обновить сертификат; nginx перечитывает конфиг ежедневно.
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

networks:
  web:
    driver: bridge

volumes:
  app_data:
  certbot_etc:
  certbot_www:

# nginx.conf — reverse-proxy для agent-dialogue.ru
# Терминация TLS, апстрим — Gunicorn (Flask) в контейнере app:5000.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    client_max_body_size 16m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Апстрим к Gunicorn (имя сервиса из docker-compose, разрешается Docker DNS)
    upstream agent_dialogue_app {
        server app:5000 fail_timeout=10s max_fails=3;
        keepalive 32;
    }

    # --- HTTP (80): ACME challenge + redirect на HTTPS ---------------------
    server {
        listen      80;
        listen      [::]:80;
        server_name agent-dialogue.ru www.agent-dialogue.ru;

        # Точка для webroot-валидации Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # Локальный healthcheck nginx-контейнера
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Всё остальное — на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS (443): основной сервер -------------------------------------
    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        http2       on;
        server_name agent-dialogue.ru www.agent-dialogue.ru;

        ssl_certificate     /etc/letsencrypt/live/agent-dialogue.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agent-dialogue.ru/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/agent-dialogue.ru/chain.pem;

        # Современные настройки TLS (Mozilla intermediate)
        ssl_protocols         TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers           ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache     shared:SSL:10m;
        ssl_session_timeout   1d;
        ssl_session_tickets   off;
        ssl_stapling          on;
        ssl_stapling_verify   on;
        resolver              1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout      5s;

        # HSTS + базовые security-заголовки
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # Раздаём статику Flask напрямую, минуя Gunicorn (если /static смонтирован).
        # По умолчанию идём через апстрим — у статика небольшая, оверхеда не даёт.

        # Smoke-test для CD (Ansible) — без access-лога, чтобы не засорять
        location = /api/health {
            access_log off;
            proxy_pass         http://agent_dialogue_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Основной reverse-proxy на Gunicorn
        location / {
            proxy_pass         http://agent_dialogue_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Длинные LLM-запросы — даём время до 120с (как timeout у gunicorn)
            proxy_connect_timeout 10s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;

            proxy_buffering       on;
            proxy_request_buffering on;
        }
    }
}
